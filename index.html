
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
        }

        .icon {
            font-size: 75px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 100px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        p {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background: #1e293b;
            color: #facc15;
            border: 1px solid #facc15;
            padding: 10px 18px;
            border-radius: 30px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background: #38bdf8;
            color: #0f172a;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0284c7;
            color: white;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: #64748b;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 75px;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚧</div>

        <div class="badge">⚙️ WEBSITE UNDER CONSTRUCTION</div>

        <h1>404</h1>

        <h2>Oops! Page Not Found</h2>

        <p>
            The page you are looking for is either under construction
            or does not exist yet. We are working hard to bring
            something amazing to you. Please check back soon!
        </p>

        <a href="https://www.google.com/?zx=1792594955859" class="btn">← Back to Home</a>

        <div class="footer">
            © 2026 CodeHive with Shubham. All rights reserved.
        </div>

    </div>

</body>
</html>
